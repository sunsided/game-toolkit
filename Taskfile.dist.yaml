# game-toolkit — Rust workspace task runner
# https://taskfile.dev
version: '3'

vars:
  PROFILE: '{{ .PROFILE | default "debug" }}'
  PROFILE_FLAG: '{{ if eq .PROFILE "release" }}--release{{ end }}'
  PROFILE_DIR: '{{ if eq .PROFILE "release" }}release{{ else }}debug{{ end }}'

  # Default example binary for `task run`. Override: task run EXAMPLE=ex_05_tilemap
  EXAMPLE: '{{ .EXAMPLE | default "bouncing_ball" }}'

  # Crate directory (with index.html + Trunk.toml) for the `web*` tasks.
  WEB_DIR: '{{ .WEB_DIR | default "examples/13_web" }}'

tasks:
  default:
    cmds:
      - task --list --sort=none
    silent: true

  fmt:
    desc: Format all Rust sources
    aliases: [format]
    preconditions:
      - sh: command -v cargo
        msg: "cargo not found — install Rust from https://rustup.rs/"
    sources:
      - ./**/*.rs
    cmds:
      - cargo fmt --all

  lint:
    desc: Lint the workspace (clippy, warnings are errors)
    preconditions:
      - sh: command -v cargo
        msg: "cargo not found — install Rust from https://rustup.rs/"
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings {{.CLI_ARGS}}

  lint:fix:
    desc: Auto-fix clippy lints, then format
    aliases: [fix]
    cmds:
      - cargo clippy --workspace --all-targets --fix --allow-staged {{.CLI_ARGS}}
      - task: fmt

  check:
    desc: Static checks - format check, clippy (native + wasm), and template sync
    cmds:
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets -- -D warnings
      - task: check:wasm
      - task: check:templates

  check:wasm:
    desc: Clippy the workspace for the browser target (wasm32-unknown-unknown, all features)
    preconditions:
      - sh: rustup target list --installed | grep -qx wasm32-unknown-unknown
        msg: "wasm target missing — run: rustup target add wasm32-unknown-unknown"
    cmds:
      - cargo clippy --target wasm32-unknown-unknown --workspace --all-targets --all-features -- -D warnings {{.CLI_ARGS}}

  sync:templates:
    desc: Stamp the canonical guide into each template's CLAUDE.md and the umbrella crate's docs
    cmds:
      - tools/sync-guide.sh

  check:templates:
    desc: Verify the templates' CLAUDE.md and crates/prelude/src/guide.md match the canonical guide
    cmds:
      - tools/sync-guide.sh --check

  test:templates:
    desc: Generate each jam template against this checkout and run fmt --check + clippy on it (needs cargo-generate)
    preconditions:
      - sh: command -v cargo-generate
        msg: "cargo-generate not found — run: cargo install cargo-generate --locked"
    cmds:
      - tools/check-templates.sh

  build:
    desc: Build the whole workspace (PROFILE=debug|release)
    preconditions:
      - sh: command -v cargo
        msg: "cargo not found — install Rust from https://rustup.rs/"
    requires:
      vars:
        - name: PROFILE
          enum: [debug, release]
    sources:
      - Cargo.toml
      - Cargo.lock
      - crates/**/*.rs
      - crates/**/*.toml
      - examples/**/*.rs
      - examples/**/*.toml
    cmds:
      - cargo build --workspace --all-targets {{.PROFILE_FLAG}} {{.CLI_ARGS}}

  build:release:
    desc: Build the workspace in release mode
    cmds:
      - task: build
        vars: {PROFILE: release}

  test:
    desc: Run all tests (nextest if available, falls back to cargo test)
    env:
      RUST_LOG: disabled
    cmds:
      - |
        if command -v cargo-nextest >/dev/null 2>&1; then
          cargo nextest run --workspace {{.CLI_ARGS}}
          # nextest does not run doctests — run them separately
          cargo test --workspace --doc {{.CLI_ARGS}}
        else
          cargo test --workspace {{.CLI_ARGS}}
        fi

  run:
    desc: 'Run an example by package (EXAMPLE=ex_02_sprite); see `task --list` for example:* shortcuts'
    preconditions:
      - sh: command -v cargo
        msg: "cargo not found — install Rust from https://rustup.rs/"
    cmds:
      - cargo run {{.PROFILE_FLAG}} -p {{.EXAMPLE}} -- {{.CLI_ARGS}}

  example:window:
    desc: Run the window example
    aliases: [run:window]
    cmds:
      - task: run
        vars: {EXAMPLE: ex_01_window}

  example:primitives:
    desc: Run the primitives example
    aliases: [run:primitives]
    cmds:
      - task: run
        vars: {EXAMPLE: ex_03_primitives}

  example:text:
    desc: Run the text example
    aliases: [run:text]
    cmds:
      - task: run
        vars: {EXAMPLE: ex_04_text}

  example:tilemap:
    desc: Run the tilemap example
    aliases: [run:tilemap]
    cmds:
      - task: run
        vars: {EXAMPLE: ex_05_tilemap}

  example:egui:
    desc: Run the egui example
    aliases: [run:egui]
    cmds:
      - task: run
        vars: {EXAMPLE: ex_06_egui}

  example:ball:
    desc: Run the bouncing ball example
    aliases: [run:ball]
    cmds:
      - task: run
        vars: {EXAMPLE: bouncing_ball}

  example:sprite:
    desc: Run the PNG sprite example
    aliases: [run:sprite]
    cmds:
      - task: run
        vars: {EXAMPLE: ex_02_sprite}

  example:audio:
    desc: Run the audio example (WAV + synth effects)
    aliases: [run:audio]
    cmds:
      - task: run
        vars: {EXAMPLE: ex_07_audio}

  example:hotreload:
    desc: Run the texture hot-reload example
    aliases: [run:hotreload]
    cmds:
      - task: run
        vars: {EXAMPLE: ex_08_hot_reload}

  example:aseprite:
    desc: Run the Aseprite animation example
    aliases: [run:aseprite]
    cmds:
      - task: run
        vars: {EXAMPLE: ex_09_aseprite}

  example:gamepad:
    desc: Run the gamepad overlay example
    aliases: [run:gamepad]
    cmds:
      - task: run
        vars: {EXAMPLE: ex_10_gamepad}

  example:3d:
    desc: Run the 3D spinning-cubes example
    aliases: [run:3d]
    cmds:
      - task: run
        vars: {EXAMPLE: ex_07_3d}

  example:vector:
    desc: Run the vello vector-graphics example
    aliases: [run:vector]
    cmds:
      - task: run
        vars: {EXAMPLE: ex_12_vector}

  example:framebuffer:
    desc: Run the software-rendered framebuffer example (update_texture_rgba)
    aliases: [run:framebuffer]
    cmds:
      - task: run
        vars: {EXAMPLE: ex_14_framebuffer}

  web:
    desc: 'Serve a crate in the browser with live rebuild (WEB_DIR=examples/13_web), http://localhost:8080'
    aliases: [example:web, run:web]
    preconditions: &web-preconditions
      - sh: command -v trunk
        msg: "trunk not found — run: cargo install trunk --locked"
      - sh: rustup target list --installed | grep -qx wasm32-unknown-unknown
        msg: "wasm target missing — run: rustup target add wasm32-unknown-unknown"
    dir: '{{.WEB_DIR}}'
    cmds:
      - trunk serve {{.PROFILE_FLAG}} {{.CLI_ARGS}}

  web:build:
    desc: 'Build a crate for the browser into <WEB_DIR>/dist (PROFILE=release for an upload-ready build)'
    preconditions: *web-preconditions
    dir: '{{.WEB_DIR}}'
    cmds:
      - trunk build {{.PROFILE_FLAG}} {{.CLI_ARGS}}

  assets:manifest:
    desc: 'Regenerate <WEB_DIR>/assets/manifest.txt, the list of files the web build preloads'
    dir: '{{.WEB_DIR}}/assets'
    cmds:
      - |
        {
          echo "# Files the web build preloads before Game::init (one path per line, relative to assets/)."
          echo "# Regenerate with: task assets:manifest WEB_DIR={{.WEB_DIR}}"
          find . -type f ! -name manifest.txt ! -name '.*' | sed 's|^\./||' | LC_ALL=C sort
        } > manifest.txt

  atlas:
    desc: 'Run the atlas packer (e.g. task atlas -- --input sprites/ --output a.png --metadata a.json)'
    preconditions:
      - sh: command -v cargo
        msg: "cargo not found — install Rust from https://rustup.rs/"
    cmds:
      - cargo run {{.PROFILE_FLAG}} -p atlas-packer -- {{.CLI_ARGS}}

  docs:
    desc: Build rustdoc for the workspace
    sources:
      - crates/**/*.rs
      - crates/**/*.toml
    generates:
      - target/doc/**
    cmds:
      - cargo doc --workspace --no-deps {{.CLI_ARGS}}

  docs:open:
    desc: Build and open rustdoc in the browser
    aliases: [open:docs]
    cmds:
      - task: docs
        vars:
          CLI_ARGS: --open {{.CLI_ARGS}}

  ci:
    desc: Full CI sequence - static checks then tests
    cmds:
      - task: check
      - task: test

  publish:
    desc: Publish all crates to crates.io in dependency order (prompts; cannot be undone)
    prompt: "Publish all toolkit crates to crates.io? This is permanent."
    preconditions:
      - sh: command -v cargo
        msg: "cargo not found — install Rust from https://rustup.rs/"
    cmds:
      - task: publish:run

  publish:dry:
    desc: 'Dry-run the publish in order (dependent crates fail until their deps are live)'
    aliases: [publish:check]
    cmds:
      - task: publish:run
        vars: {DRY: "--dry-run"}

  publish:run:
    internal: true
    # Dependency order: leaves first, then aseprite/ui/core, then prelude. `cargo publish`
    # waits for each crate to propagate to the index before the next one builds.
    cmds:
      - for:
          [
            game-toolkit-gfx,
            game-toolkit-input,
            game-toolkit-audio,
            game-toolkit-assets,
            game-toolkit-ecs,
            game-toolkit-aseprite,
            game-toolkit-ui,
            game-toolkit-core,
            game-toolkit,
          ]
        cmd: cargo publish -p {{.ITEM}} --locked {{.DRY}} {{.CLI_ARGS}}

  update:
    desc: Update dependencies in Cargo.lock
    cmds:
      - cargo update {{.CLI_ARGS}}

  labels:
    desc: Create/update the PR labels used by .github/labeler.yml on GitHub (needs gh auth)
    preconditions:
      - sh: command -v gh
        msg: "gh CLI not found"
    cmds:
      - |
        while IFS='|' read -r name color desc; do
          gh label create "$name" --color "$color" --description "$desc" --force
        done <<'EOF'
        area: core|1d76db|game-toolkit-core: app loop, Game trait, Context, Time
        area: gfx|1d76db|game-toolkit-gfx: wgpu renderer, sprites, SDF, text, tilemap, 3D
        area: input|1d76db|game-toolkit-input: keyboard, mouse, gamepad
        area: audio|1d76db|game-toolkit-audio: kira playback, synth
        area: assets|1d76db|game-toolkit-assets: path resolution, hot reload
        area: aseprite|1d76db|game-toolkit-aseprite: .aseprite and sheet loading
        area: ecs|1d76db|game-toolkit-ecs: sillyecs glue
        area: ui|1d76db|game-toolkit-ui: egui debug overlay
        area: prelude|1d76db|game-toolkit umbrella crate and prelude
        area: examples|c5def5|examples/
        area: templates|c5def5|cargo-generate jam templates
        area: tools|c5def5|tools/ (atlas-packer)
        area: ci|ededed|Workflows, Taskfile, release config
        documentation|0075ca|Improvements or additions to documentation
        dependencies|0366d6|Cargo.lock changes
        EOF

  clean:
    desc: Remove all build artifacts
    status:
      - test ! -d target
    cmds:
      - cargo clean
