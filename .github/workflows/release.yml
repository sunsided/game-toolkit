name: Release

# Push a `vX.Y.Z` tag (e.g. `cargo release 0.1.0 --execute` creates and pushes it) to
# publish every toolkit crate to crates.io in dependency order.
on:
  push:
    tags: ["v*"]

# `gh release create` needs to write to the repository.
permissions:
  contents: write

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libdbus-1-dev libudev-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-release

      # `cargo release publish` reads release.toml, skips `publish = false` members, and
      # publishes the rest in dependency order, waiting for the index between each.
      # The tag checkout is a detached HEAD, which release.toml's `allow-branch = ["main"]`
      # would reject, so allow it here.
      - name: Publish workspace
        run: cargo release publish --workspace --no-confirm --execute --allow-branch HEAD
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Release notes are the tag's CHANGELOG.md section. Its hard-wrapped lines are joined,
      # because GitHub renders single newlines in release bodies as line breaks. Falls back to
      # generated notes when the changelog has no section for this version.
      - name: Create GitHub release
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { if (p) exit; if (index($0, "## [" v "]") == 1) { p = 1; next } }
            !p { next }
            /^$/ || /^#/ || /^- / { if (buf != "") print buf; buf = $0; if ($0 == "" || /^#/) { print buf; buf = "" }; next }
            { sub(/^ +/, ""); buf = (buf == "" ? $0 : buf " " $0) }
            END { if (buf != "") print buf }
          ' CHANGELOG.md | sed -e '/./,$!d' > release-notes.md
          if [ -s release-notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --verify-tag --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
