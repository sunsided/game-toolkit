name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch / PR supersedes the running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: clippy · test · docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # templates/jam-agent-guide.md is stamped into the templates' CLAUDE.md and into
      # crates/prelude/src/guide.md (docs.rs). Fail fast (no toolchain needed) if a copy
      # drifted; `task sync:templates` re-stamps them.
      - name: Guide copies in sync
        run: tools/sync-guide.sh --check

      # ALSA + D-Bus headers for kira (cpal backend; dbus via audio_thread_priority), udev for gilrs.
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libdbus-1-dev libudev-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The repo's hard gate is clippy (warnings = errors), matching `task lint`.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Prelude features (`synth`, ...) not every example turns on.
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # Fail on broken intra-doc links before docs.rs ever sees them.
      - name: Docs
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  templates:
    name: jam templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Same system deps as the main job: the generated games link kira and gilrs.
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libdbus-1-dev libudev-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-generate

      # Generates each template (short and long project name) against this checkout of the
      # toolkit, then runs fmt --check and clippy (native + wasm32) like a fresh jam project.
      - name: Generate and check the templates
        run: tools/check-templates.sh

  wasm:
    name: wasm (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # No Linux system deps: on wasm32 audio is WebAudio, gamepads the Gamepad API.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (wasm32, all features)
        run: cargo clippy --target wasm32-unknown-unknown --workspace --all-targets --all-features --locked -- -D warnings

      # trunk fetches the wasm-bindgen CLI matching Cargo.lock on its own.
      - name: Install trunk
        run: |
          curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.cargo/bin"

      - name: Build the web example
        working-directory: examples/13_web
        run: trunk build --release --locked

  msrv:
    name: MSRV (rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libdbus-1-dev libudev-dev pkg-config

      # Keep in sync with `rust-version` in the workspace Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.95

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace --all-targets --all-features --locked
