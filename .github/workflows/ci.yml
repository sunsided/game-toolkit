name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch / PR supersedes the running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: clippy · test · docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The jam templates ship a bundled CLAUDE.md synced from templates/jam-agent-guide.md.
      # Fail fast (no toolchain needed) if a copy drifted; `task sync:templates` re-stamps them.
      - name: Templates in sync
        run: |
          for t in jam jam-3d; do
            if ! cmp -s templates/jam-agent-guide.md "templates/$t/CLAUDE.md"; then
              echo "::error file=templates/$t/CLAUDE.md::out of sync with templates/jam-agent-guide.md; run: task sync:templates"
              exit 1
            fi
          done

      # ALSA headers for kira (cpal backend), udev for gilrs gamepad input.
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The repo's hard gate is clippy (warnings = errors), matching `task lint`.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Prelude features (`synth`, ...) not every example turns on.
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # Fail on broken intra-doc links before docs.rs ever sees them.
      - name: Docs
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV (rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config

      # Keep in sync with `rust-version` in the workspace Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.95

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace --all-targets --all-features --locked
