[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/gfx",
    "crates/input",
    "crates/audio",
    "crates/assets",
    "crates/aseprite",
    "crates/ecs",
    "crates/ui",
    "crates/prelude",
    "examples/bouncing_ball",
    "examples/01_window",
    "examples/02_sprite",
    "examples/03_primitives",
    "examples/04_text",
    "examples/05_tilemap",
    "examples/06_egui",
    "examples/07_3d",
    "examples/07_audio",
    "examples/08_hot_reload",
    "examples/09_aseprite",
    "examples/10_gamepad",
    "examples/11_ecs",
    "examples/12_vector",
    "tools/atlas-packer",
]
# cargo-generate templates contain `{{placeholders}}` and depend on the toolkit via git, so
# they are not workspace members.
exclude = ["templates"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "EUPL-1.2"
repository = "https://github.com/sunsided/game-toolkit"
authors = ["Markus Mayer"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
# `version` (matching workspace.package.version) lets these path deps publish to crates.io;
# the path is used in-workspace, the version when packaged. Keep both in sync on a bump.
game-toolkit-core     = { path = "crates/core", version = "0.2.0" }
game-toolkit-gfx      = { path = "crates/gfx", version = "0.2.0" }
game-toolkit-input    = { path = "crates/input", version = "0.2.0" }
game-toolkit-audio    = { path = "crates/audio", version = "0.2.0" }
game-toolkit-assets   = { path = "crates/assets", version = "0.2.0" }
game-toolkit-aseprite = { path = "crates/aseprite", version = "0.2.0" }
game-toolkit-ecs      = { path = "crates/ecs", version = "0.2.0" }
game-toolkit-ui       = { path = "crates/ui", version = "0.2.0" }
game-toolkit  = { path = "crates/prelude", version = "0.2.0" }

anyhow      = "1"
bytemuck    = { version = "1.25", features = ["derive"] }
log         = "0.4"
env_logger  = "0.11"
pollster    = "0.4"
wgpu        = "29"
winit       = "0.30"
image       = { version = "0.25", default-features = false, features = ["png"] }
kira        = "0.12"
glyphon     = "0.11"
notify      = "8"
gilrs       = "0.11"
egui        = "0.34"
egui-wgpu   = "0.34"
egui-winit  = "0.34"
ah-asefile  = "0.4"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
indexmap    = { version = "2", features = ["serde"] }
clap        = { version = "4", features = ["derive"] }
etagere     = "0.3"
sillyecs     = "0.0.6"
tracing      = "0.1"
vello        = "0.9"
# Defaults to wgpu_28; pin the feature to our wgpu 29 so the texture types match.
miniscreenshot-wgpu = { version = "0.2.1", default-features = false, features = ["wgpu-29"] }
# Synthesis only (no `io`, which would pull cpal and fight kira for the audio device).
synthie     = { version = "0.4", default-features = false, features = ["std"] }
