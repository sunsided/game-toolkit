[workspace]
# MSRV-aware resolution: picks dependency versions compatible with `rust-version`.
resolver = "3"
members = [
    "crates/core",
    "crates/gfx",
    "crates/input",
    "crates/audio",
    "crates/assets",
    "crates/aseprite",
    "crates/ecs",
    "crates/ui",
    "crates/prelude",
    "examples/bouncing_ball",
    "examples/01_window",
    "examples/02_sprite",
    "examples/03_primitives",
    "examples/04_text",
    "examples/05_tilemap",
    "examples/06_egui",
    "examples/07_3d",
    "examples/07_audio",
    "examples/08_hot_reload",
    "examples/09_aseprite",
    "examples/10_gamepad",
    "examples/11_ecs",
    "examples/12_vector",
    "examples/13_web",
    "tools/atlas-packer",
]
# cargo-generate templates contain `{{placeholders}}` and depend on the toolkit via git, so
# they are not workspace members.
exclude = ["templates"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "EUPL-1.2"
repository = "https://github.com/sunsided/game-toolkit"
authors = ["Markus Mayer"]
# egui 0.37 sets the floor. CI runs an MSRV job against this exact toolchain.
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

# CI and `task lint` run clippy with `-D warnings`, so `warn` here is a hard gate.
[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
manual_let_else = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"

[workspace.dependencies]
# `version` (matching workspace.package.version) lets these path deps publish to crates.io;
# the path is used in-workspace, the version when packaged. Keep both in sync on a bump.
game-toolkit-core     = { path = "crates/core", version = "0.4.0" }
game-toolkit-gfx      = { path = "crates/gfx", version = "0.4.0" }
game-toolkit-input    = { path = "crates/input", version = "0.4.0" }
game-toolkit-audio    = { path = "crates/audio", version = "0.4.0" }
game-toolkit-assets   = { path = "crates/assets", version = "0.4.0" }
game-toolkit-aseprite = { path = "crates/aseprite", version = "0.4.0" }
game-toolkit-ecs      = { path = "crates/ecs", version = "0.4.0" }
game-toolkit-ui       = { path = "crates/ui", version = "0.4.0" }
game-toolkit  = { path = "crates/prelude", version = "0.4.0" }

anyhow      = "1"
bytemuck    = { version = "1.25", features = ["derive"] }
log         = "0.4"
env_logger  = "0.11"
pollster    = "1"
wgpu        = "30"
winit       = "0.30"
image       = { version = "0.25", default-features = false, features = ["png"] }
kira        = "0.12"
glyphon     = "0.12"
notify      = "8"
gilrs       = "0.11"
# `default_fonts` stopped being a default feature in egui 0.37; without it no text renders.
egui        = { version = "0.37", features = ["default_fonts"] }
egui-wgpu   = "0.37"
# Defaults off here so members can choose per target: the default `clipboard` feature pulls
# arboard, which has no web backend (crates/ui turns defaults back on natively).
egui-winit  = { version = "0.37", default-features = false }
ah-asefile  = "0.4"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
indexmap    = { version = "2", features = ["serde"] }
clap        = { version = "4", features = ["derive"] }
etagere     = "0.3"
sillyecs     = "0.0.7"
sillyecs-build = "0.0.7"
tracing      = "0.1"
vello        = "0.11"
# Web (wasm32) only: browser bindings, promise interop, and an `Instant` that works there.
wasm-bindgen         = "0.2"
wasm-bindgen-futures = "0.4"
js-sys               = "0.3"
web-sys              = "0.3"
web-time             = "1"
# Pin the wgpu track to our wgpu 30 so the texture types match.
miniscreenshot-wgpu = { version = "0.3.1", default-features = false, features = ["wgpu-30"] }
# Synthesis only (no `io`, which would pull cpal and fight kira for the audio device).
synthie     = { version = "0.4", default-features = false, features = ["std"] }
