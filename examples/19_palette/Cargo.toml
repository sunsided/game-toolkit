[package]
name = "ex_19_palette"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "19_palette"
path = "src/main.rs"

[dependencies]
game-toolkit = { workspace = true, features = ["indexed"] }

# On the web the toolkit logs to the browser console itself.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = { workspace = true }

[lints]
workspace = true
