<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>13_web - game-toolkit</title>
    <!-- trunk: build the crate's binary to wasm and copy the asset folder next to it. -->
    <link data-trunk rel="rust" data-bin="13_web" />
    <link data-trunk rel="copy-dir" href="assets" />
    <style>
      html, body { margin: 0; height: 100%; background: #141419; }
      body { display: flex; align-items: center; justify-content: center; }
      /* Keep keyboard focus on the game and hide the focus ring. */
      canvas { outline: none; }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
  </body>
</html>
