[package]
name = "ex_11_ecs"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "11_ecs"
path = "src/main.rs"

[dependencies]
game-toolkit = { workspace = true, features = ["ecs"] }
env_logger = { workspace = true }
# The generated ECS code logs via tracing.
tracing = { workspace = true }
# Runtime support types (EntityId, FrameContext, ...) the generated code refers to.
sillyecs = { workspace = true }

# sillyecs times phases with `Instant`; its `wasm` feature swaps in one that works in the
# browser (`std::time::Instant` panics there).
[target.'cfg(target_arch = "wasm32")'.dependencies]
sillyecs = { workspace = true, features = ["wasm"] }

[build-dependencies]
sillyecs-build = { workspace = true }

[lints]
workspace = true
