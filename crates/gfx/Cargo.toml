[package]
name = "game-toolkit-gfx"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "wgpu rendering for game-toolkit: sprite/primitive/text batchers, tilemaps, 3D meshes, optional vello."
keywords = ["wgpu", "rendering", "graphics", "gamedev", "2d"]
categories = ["game-development", "rendering", "graphics"]

[dependencies]
anyhow   = { workspace = true }
bytemuck = { workspace = true }
image    = { workspace = true }
log      = { workspace = true }
pollster = { workspace = true }
wgpu     = { workspace = true }
winit    = { workspace = true }
glyphon  = { workspace = true }
miniscreenshot-wgpu = { workspace = true }
vello    = { workspace = true, optional = true }

[features]
# Vello vector-graphics backend (compute-based; needs higher device limits).
vector = ["dep:vello"]

[lints]
workspace = true
