[package]
name = "game-toolkit-gfx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "wgpu rendering for game-toolkit: sprite/primitive/text batchers, tilemaps, 3D meshes, optional vello."
keywords = ["wgpu", "rendering", "gamedev", "2d", "3d"]
categories = ["game-development", "rendering", "graphics"]

[dependencies]
anyhow   = { workspace = true }
bytemuck = { workspace = true }
image    = { workspace = true }
log      = { workspace = true }
wgpu     = { workspace = true }
winit    = { workspace = true }
glyphon  = { workspace = true }
miniscreenshot-wgpu = { workspace = true }
vello    = { workspace = true, optional = true }
web-time = { workspace = true }
png      = { workspace = true, optional = true }

# Web: WebGPU (a wgpu default) plus the WebGL2 fallback for browsers without it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu     = { workspace = true, features = ["webgl"] }

[dev-dependencies]
pollster = { workspace = true }

[features]
# Vello vector-graphics backend (compute-based; needs higher device limits).
vector = ["dep:vello"]
# Built-in CRT post-processing effect (`CrtEffect`).
crt = []
# Indexed-colour canvas: palettes, palette cycling, indexed PNGs.
indexed = ["dep:png"]

[lints]
workspace = true
