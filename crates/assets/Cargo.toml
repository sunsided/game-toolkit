[package]
name = "game-toolkit-assets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Asset path resolution and optional hot-reload (notify) for game-toolkit."
keywords = ["assets", "hot-reload", "gamedev", "gamejam"]
categories = ["game-development", "filesystem"]

[dependencies]
anyhow = { workspace = true }
log    = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
notify = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen         = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys               = { workspace = true }
web-sys              = { workspace = true, features = ["Window", "Response"] }

[lints]
workspace = true
