[package]
name = "game-toolkit-compute"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "GPU compute helpers for game-toolkit: ping-pong storage buffers, WGSL kernels, non-blocking read-back."
keywords = ["wgpu", "compute", "gpgpu", "gamedev", "simulation"]
categories = ["game-development", "rendering", "simulation"]

[dependencies]
game-toolkit-gfx = { workspace = true, optional = true }
wgpu             = { workspace = true }
bytemuck         = { workspace = true }
log              = { workspace = true }

[dev-dependencies]
pollster = { workspace = true }

[features]
default = ["gfx"]
# `StorageTexture`, drawn by the game-toolkit `Painter`. Without it the crate needs only wgpu
# (no game-toolkit-gfx, no winit), for engine-agnostic simulation crates and headless runs.
gfx = ["dep:game-toolkit-gfx"]

[lints]
workspace = true
