[package]
name = "game-toolkit-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "egui debug-overlay integration for game-toolkit."
keywords = ["egui", "debug", "overlay", "gamedev", "ui"]
categories = ["game-development", "gui"]

[dependencies]
anyhow      = { workspace = true }
log         = { workspace = true }
wgpu        = { workspace = true }
winit       = { workspace = true }
egui        = { workspace = true }
egui-wgpu   = { workspace = true }
game-toolkit-gfx = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-winit  = { workspace = true, features = ["default"] }

# egui-winit's default `clipboard` feature pulls arboard, which has no web backend.
[target.'cfg(target_arch = "wasm32")'.dependencies]
egui-winit  = { workspace = true, features = ["links"] }

[lints]
workspace = true
