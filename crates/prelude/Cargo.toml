[package]
name = "game-toolkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A Rust game-jam toolkit for 2D and 3D - umbrella crate; use game_toolkit::prelude::* and go."
keywords = ["gamedev", "gamejam", "2d", "3d", "toolkit"]
categories = ["game-development", "game-engines"]

[dependencies]
game-toolkit-core   = { workspace = true }
game-toolkit-gfx    = { workspace = true }
game-toolkit-input  = { workspace = true }
game-toolkit-audio    = { workspace = true }
game-toolkit-assets   = { workspace = true }
game-toolkit-aseprite = { workspace = true, optional = true }
game-toolkit-ecs      = { workspace = true, optional = true }
game-toolkit-ui       = { workspace = true, optional = true }
winit            = { workspace = true }
anyhow           = { workspace = true }

[features]
default = []
ui = ["dep:game-toolkit-ui"]
aseprite = ["dep:game-toolkit-aseprite"]
ecs = ["dep:game-toolkit-ecs"]
synth = ["game-toolkit-audio/synth"]
vector = ["game-toolkit-gfx/vector"]

[lints]
workspace = true

# cargo-release (see the root release.toml): stamp the workspace CHANGELOG.md during
# `cargo release`. Set on this crate only, so the shared changelog is rewritten once per
# release rather than once per member. Paths are relative to this crate.
[package.metadata.release]
pre-release-replacements = [
  # Turn the pending notes into the release's section and open a fresh [Unreleased] above it.
  { file = "../../CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
  # Point [Unreleased] at the new tag and add a compare link for the release.
  { file = "../../CHANGELOG.md", search = "\\[Unreleased\\]: (\\S+)/compare/(\\S+)\\.\\.\\.HEAD", replace = "[Unreleased]: $1/compare/{{tag_name}}...HEAD\n[{{version}}]: $1/compare/$2...{{tag_name}}", exactly = 1 },
]
